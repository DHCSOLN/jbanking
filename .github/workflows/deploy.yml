name: Deploy State of Loc Nation App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clean code repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Securely store and upload the deployment assets
      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: soln-production-build
          path: .
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # 3. Retrieve deployment artifact files
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: soln-production-build
          path: ./dist

      # 4. Release command hook
      - name: Deploy to Web Server
        run: |
          echo "Deploying production assets straight to stateoflocnation.com..."
