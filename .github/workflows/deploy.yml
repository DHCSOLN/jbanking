
name: Deploy State of Loc Nation App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Clean code repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify index.html exists in the runner
      - name: Check File Presence
        run: |
          ls -la
          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found in the root directory!"
            exit 1
          fi

      # 3. Securely store and upload only the dashboard file
      - name: Upload Dashboard File
        uses: actions/upload-artifact@v5
        with:
          name: soln-production-build
          path: index.html
          retention-days: 7

      # 4. Release command hook
      - name: Deploy to Web Server
        run: |
          echo "Deploying production assets straight to stateoflocnation.com..."
