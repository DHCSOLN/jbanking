name: Deploy State of Loc Nation App

on:
  push:
    branches:
      - main  # Triggers deployment when code is pushed to main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Global environment variables for your dual-currency engine & domain
    env:
      DEPLOY_DOMAIN: "stateoflocnation.com"
      PARITY_USD_PER_LND: 750
      CURRENCY_SCALE: 1000000 # Matches your 6-decimal ledger precision

    steps:
      # 1. Check out code (Updated to v4 to support modern Node.js runners)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Explicitly use Node 24 to match GitHub's future requirements
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run automated tests (Ensures LND/USD math doesn't break)
      - name: Verify Currency Conversion Logic
        run: npm test

      # 5. Verify live domain DNS / Reachability before final build
      - name: Verify Live Domain Setup
        run: |
          echo "Verifying DNS status for $DEPLOY_DOMAIN..."
          nslookup $DEPLOY_DOMAIN || echo "Warning: Domain lookup failed. Proceeding with build..."

      # 6. Build the deployment bundle
      - name: Build Application
        run: npm run build

      # 7. Upload Build Artifacts (Updated to v5 to fix your Node 20 warning! 🎉)
      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: soln-production-build
          path: ./dist
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy on true merges to main

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4 # Updated to v4 for compatibility
        with:
          name: soln-production-build
          path: ./dist

      # Add your specific hosting deployment steps here (Vercel, AWS, Cloudflare, etc.)
      - name: Deploy to Web Server
        run: |
          echo "Deploying production build to stateoflocnation.com..."
          # Example: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
